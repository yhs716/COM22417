<!-- 기본과제 하나의 작업 공간에서 기존 완성 기능을 단계별로 사용합니다. -->
<p id="object-owner-note" class="execution-status">로그인 후 발급 DB 계정을 표시합니다.</p>
<section id="basic-workflow" class="basic-intro" aria-label="기본과제 작업 흐름">
  <nav class="basic-tabs" aria-label="기본과제 작업 단계">
    {% for screen,label in basic_screens %}
    <a class="workflow-tab" href="/basic#{{ screen }}" data-basic-tab="{{ screen }}" {% if active==screen %}aria-current="step"{% endif %}><span class="tab-number" aria-hidden="true">{{ '%02d'|format(loop.index) }}</span><span class="tab-label">{{ label }}</span></a>
    {% if not loop.last %}<a class="workflow-next" href="/basic#{{ basic_screens[loop.index][0] }}" data-step-next="{{ basic_screens[loop.index][0] }}" aria-label="다음 단계: {{ basic_screens[loop.index][1] }}" title="{{ basic_screens[loop.index][1] }}로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg></a>{% endif %}
    {% endfor %}
  </nav>
</section>
{% for screen,label in basic_screens %}
<div id="basic-{{ screen }}" data-basic-panel="{{ screen }}" role="region" aria-label="기본과제 · {{ label }}" tabindex="-1" {% if active!=screen %}hidden{% endif %}>
  {% include 'pages/' ~ screen ~ '.html' %}
</div>
{% endfor %}

{% include 'dataset-viewer.html' %}
